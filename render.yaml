# Free public demo. Postgres expires after 30 days; upgrade before that date to retain it.
# Run the explicit migration command in docs/OPERATIONS-TR.md before first deployment.
services:
  - type: web
    name: ecommerce-mira
    runtime: docker
    plan: free
    region: frankfurt
    branch: master
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: off
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: 8080
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-mira-db
          property: connectionString
      - key: Database__SslMode
        value: Disable
      - key: Jwt__Issuer
        value: ecommerce-mira
      - key: Jwt__Audience
        value: ecommerce-mira-clients
      - key: Jwt__SecretKey
        generateValue: true
      - key: Jwt__ExpirationMinutes
        value: 15
      - key: PublicDemo__Enabled
        value: true
      - key: DemoSeed__Enabled
        value: true
      - key: ReverseProxy__KnownNetworks__0
        value: 10.0.0.0/8
databases:
  - name: ecommerce-mira-db
    plan: free
    region: frankfurt
    databaseName: ecommerce_mira
    user: ecommerce_mira
    postgresMajorVersion: '18'
    ipAllowList: []
